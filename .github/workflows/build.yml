name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow sounddevice numpy opencv-python mss customtkinter firebase-admin

      - name: Собрать NovaMessenger.app
        run: |
          pyinstaller --noconfirm --windowed --collect-all customtkinter --name "NovaMessenger" app.py

      - name: Упаковать в установщик .dmg
        run: |
          hdiutil create -volname "NovaMessenger" -srcfolder dist/NovaMessenger.app -ov -format UDZO NovaMessenger_v1.4.dmg

      - name: Прикрепить готовый .dmg к артефактам
        uses: actions/upload-artifact@v4
        with:
          name: NovaMessenger-macOS-DMG
          path: NovaMessenger_v1.4.dmg
