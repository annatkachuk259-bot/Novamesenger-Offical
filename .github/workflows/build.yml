name: Build NovaMessenger

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --clean --onefile --hidden-import=customtkinter --hidden-import=firebase_admin --hidden-import=PIL --hidden-import=sounddevice --hidden-import=numpy --hidden-import=cv2 --hidden-import=mss app.py

      - name: Build Installer with Inno Setup
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaMessenger-Installer
          path: Output/*.exe
